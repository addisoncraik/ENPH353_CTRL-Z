#!/usr/bin/env python
PACKAGE = "time_trials"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("Kp", double_t, 0, "Proportional gain", 0.01, 0.0, 2.0)
gen.add("Kd", double_t, 0, "Derivative gain",   0.001, 0.0, 1.0)
gen.add("Ki", double_t, 0, "Integral gain",     0.1, 0.0, 1.0)

gen.add("imax", double_t, 0, "Integral clamp limit", 10.0, 0.0, 50.0)

exit(gen.generate(PACKAGE, "move.py", "CenteringPID"))
